name: Test setup-go — no version

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go 
        uses: actions/setup-go@v7

      - name: Check Go
        run: |
          go version
          which go